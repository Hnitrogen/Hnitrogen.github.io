<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650" role="img" aria-labelledby="title desc"><title id="title">PQ 子空间编码与 ADC 距离查表</title><desc id="desc">八维向量切为四段，每段用各自码本的编号表示。查询计算四份距离表，再按库内编码取值相加。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b75c2b"/></marker></defs><rect width="840" height="650" rx="18" fill="#fafbf7"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="44" font-size="28" fill="#182925" font-weight="700" text-anchor="start">PQ：保存码本编号，查询时查表相加</text><text x="32" y="78" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">示意：8 维向量 → 4 段二维子向量 → 4 个 8-bit 编码。</text><rect x="32" y="106" width="182" height="56" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="123" y="142" font-size="24" fill="#182925" font-weight="600" text-anchor="middle">x₁, x₂</text><path d="M123 168 L123 195" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="32" y="207" width="182" height="89" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="123" y="237" font-size="22" fill="#21634e" font-weight="600" text-anchor="middle">第 1 份码本</text><text x="123" y="270" font-size="18" fill="#53645d" font-weight="400" text-anchor="middle">256 个二维中心</text><path d="M123 302 L123 329" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="32" y="341" width="182" height="56" rx="12" fill="#e7f1e9" stroke="#b6c7bd"/><text x="123" y="378" font-size="25" fill="#21634e" font-weight="700" text-anchor="middle">17</text><rect x="230" y="106" width="182" height="56" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="321" y="142" font-size="24" fill="#182925" font-weight="600" text-anchor="middle">x₃, x₄</text><path d="M321 168 L321 195" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="230" y="207" width="182" height="89" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="321" y="237" font-size="22" fill="#21634e" font-weight="600" text-anchor="middle">第 2 份码本</text><text x="321" y="270" font-size="18" fill="#53645d" font-weight="400" text-anchor="middle">256 个二维中心</text><path d="M321 302 L321 329" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="230" y="341" width="182" height="56" rx="12" fill="#e7f1e9" stroke="#b6c7bd"/><text x="321" y="378" font-size="25" fill="#21634e" font-weight="700" text-anchor="middle">203</text><rect x="428" y="106" width="182" height="56" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="519" y="142" font-size="24" fill="#182925" font-weight="600" text-anchor="middle">x₅, x₆</text><path d="M519 168 L519 195" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="428" y="207" width="182" height="89" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="519" y="237" font-size="22" fill="#21634e" font-weight="600" text-anchor="middle">第 3 份码本</text><text x="519" y="270" font-size="18" fill="#53645d" font-weight="400" text-anchor="middle">256 个二维中心</text><path d="M519 302 L519 329" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="428" y="341" width="182" height="56" rx="12" fill="#e7f1e9" stroke="#b6c7bd"/><text x="519" y="378" font-size="25" fill="#21634e" font-weight="700" text-anchor="middle">4</text><rect x="626" y="106" width="182" height="56" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="717" y="142" font-size="24" fill="#182925" font-weight="600" text-anchor="middle">x₇, x₈</text><path d="M717 168 L717 195" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="626" y="207" width="182" height="89" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="717" y="237" font-size="22" fill="#21634e" font-weight="600" text-anchor="middle">第 4 份码本</text><text x="717" y="270" font-size="18" fill="#53645d" font-weight="400" text-anchor="middle">256 个二维中心</text><path d="M717 302 L717 329" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="626" y="341" width="182" height="56" rx="12" fill="#e7f1e9" stroke="#b6c7bd"/><text x="717" y="378" font-size="25" fill="#21634e" font-weight="700" text-anchor="middle">88</text><text x="32" y="436" font-size="21" fill="#182925" font-weight="600" text-anchor="start">编码：[17, 203, 4, 88]；共享码本另存，不是每条都存。</text><rect x="32" y="466" width="776" height="112" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="52" y="500" font-size="21" fill="#182925" font-weight="400" text-anchor="start">查询：把 q 分成相同的 4 段，计算各段到码本中心的距离。</text><text x="52" y="539" font-size="24" fill="#21634e" font-weight="600" text-anchor="start">近似距离² = T₁[17] + T₂[203] + T₃[4] + T₄[88]</text><text x="32" y="615" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">ADC：查询保留原精度，库内向量用编码；图示采用 L2 距离。</text></g></svg>