<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" role="img" aria-labelledby="title desc"><title id="title">IVF 分桶与边界漏召回</title><desc id="desc">三个桶中，查询 Q 的最近中心为 C1，但真近邻 R 位于第二桶。nprobe 为1漏掉 R，为2同时扫描前两桶。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b75c2b"/></marker></defs><rect width="840" height="640" rx="18" fill="#fafbf7"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="44" font-size="28" fill="#182925" font-weight="700" text-anchor="start">IVF：中心最近的桶，不保证包含最近的点</text><text x="32" y="78" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">玩具示例：nlist = 3，先按到聚类中心的距离选桶。</text><rect x="40" y="110" width="255" height="270" rx="12" fill="#e7f1e9" stroke="#b6c7bd"/><text x="54" y="145" font-size="21" fill="#21634e" font-weight="600" text-anchor="start">桶 1 · 搜索</text><rect x="295" y="110" width="230" height="270" rx="12" fill="#f2f3ef" stroke="#b6c7bd"/><text x="309" y="145" font-size="21" fill="#53645d" font-weight="600" text-anchor="start">桶 2 · 未搜索</text><rect x="525" y="110" width="275" height="270" rx="12" fill="#f2f3ef" stroke="#b6c7bd"/><text x="539" y="145" font-size="21" fill="#53645d" font-weight="600" text-anchor="start">桶 3 · 未搜索</text><circle cx="80" cy="180" r="6" fill="#53645d"/><circle cx="135" cy="225" r="6" fill="#53645d"/><circle cx="150" cy="310" r="6" fill="#53645d"/><circle cx="225" cy="325" r="6" fill="#53645d"/><circle cx="235" cy="190" r="6" fill="#53645d"/><circle cx="345" cy="175" r="6" fill="#53645d"/><circle cx="375" cy="320" r="6" fill="#53645d"/><circle cx="470" cy="220" r="6" fill="#53645d"/><circle cx="480" cy="340" r="6" fill="#53645d"/><circle cx="575" cy="180" r="6" fill="#53645d"/><circle cx="600" cy="330" r="6" fill="#53645d"/><circle cx="710" cy="220" r="6" fill="#53645d"/><circle cx="755" cy="320" r="6" fill="#53645d"/><path d="M170 270h20 M180 260v20" stroke="#21634e" stroke-width="4"/><text x="180" y="303" font-size="20" fill="#21634e" font-weight="600" text-anchor="middle">C1</text><path d="M400 270h20 M410 260v20" stroke="#21634e" stroke-width="4"/><text x="410" y="303" font-size="20" fill="#21634e" font-weight="600" text-anchor="middle">C2</text><path d="M630 270h20 M640 260v20" stroke="#21634e" stroke-width="4"/><text x="640" y="303" font-size="20" fill="#21634e" font-weight="600" text-anchor="middle">C3</text><path d="M285 224l11 11-11 11-11-11Z" fill="#b75c2b"/><circle cx="305" cy="240" r="9" fill="#b75c2b" stroke="#fafbf7" stroke-width="2"/><text x="226" y="211" font-size="21" fill="#b75c2b" font-weight="600" text-anchor="start">查询 Q</text><text x="321" y="239" font-size="21" fill="#b75c2b" font-weight="600" text-anchor="start">真近邻 R</text><rect x="40" y="410" width="760" height="70" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="60" y="440" font-size="22" fill="#182925" font-weight="600" text-anchor="start">nprobe = 1：只搜桶 1，漏掉边界另一侧的 R。</text><text x="60" y="465" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">IVF-Flat 对桶内精确计算，但全局结果仍可能近似。</text><rect x="40" y="498" width="760" height="70" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="60" y="528" font-size="22" fill="#182925" font-weight="600" text-anchor="start">nprobe = 2：连桶 2 一起搜，候选更多。</text><text x="60" y="553" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">召回通常更高，同时扫描量也变大。</text><text x="32" y="609" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">十字为聚类中心；分桶是空间划分，不是按关键词分类。</text></g></svg>