<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" role="img" aria-labelledby="title desc"><title id="title">HNSW 分层与搜索路径</title><desc id="desc">L2 含 A G，L1 含 A D G，L0 含 A 到 H。搜索 A 到 G 后下层到 D，再下层到 E。各层重复的是同一向量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b75c2b"/></marker></defs><rect width="840" height="640" rx="18" fill="#fafbf7"/><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="44" font-size="28" fill="#182925" font-weight="700" text-anchor="start">HNSW：同一批向量，不同层的邻接关系</text><text x="32" y="78" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">橙色为示意搜索路径；下层保留上层节点，坐标不变。</text><text x="32" y="122" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">L2 · 稀疏</text><path d="M100 160 L640 160" stroke="#b6c7bd" stroke-width="2" fill="none"/><circle cx="100" cy="160" r="21" fill="#21634e" stroke="#21634e" stroke-width="2"/><text x="100" y="167" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">A</text><circle cx="640" cy="160" r="21" fill="#21634e" stroke="#21634e" stroke-width="2"/><text x="640" y="167" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">G</text><text x="32" y="252" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">L1</text><path d="M100 290 L370 290" stroke="#b6c7bd" stroke-width="2" fill="none"/><path d="M370 290 L640 290" stroke="#b6c7bd" stroke-width="2" fill="none"/><circle cx="100" cy="290" r="21" fill="#21634e" stroke="#21634e" stroke-width="2"/><text x="100" y="297" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">A</text><circle cx="370" cy="290" r="21" fill="#21634e" stroke="#21634e" stroke-width="2"/><text x="370" y="297" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">D</text><circle cx="640" cy="290" r="21" fill="#21634e" stroke="#21634e" stroke-width="2"/><text x="640" y="297" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">G</text><text x="32" y="382" font-size="20" fill="#53645d" font-weight="400" text-anchor="start">L0 · 全部</text><path d="M100 420 L190 420" stroke="#b6c7bd" stroke-width="2" fill="none"/><path d="M190 420 L280 420" stroke="#b6c7bd" stroke-width="2" fill="none"/><path d="M280 420 L370 420" stroke="#b6c7bd" stroke-width="2" fill="none"/><path d="M370 420 L460 420" stroke="#b6c7bd" stroke-width="2" fill="none"/><path d="M460 420 L550 420" stroke="#b6c7bd" stroke-width="2" fill="none"/><path d="M550 420 L640 420" stroke="#b6c7bd" stroke-width="2" fill="none"/><path d="M640 420 L730 420" stroke="#b6c7bd" stroke-width="2" fill="none"/><circle cx="100" cy="420" r="21" fill="#21634e" stroke="#21634e" stroke-width="2"/><text x="100" y="427" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">A</text><circle cx="190" cy="420" r="21" fill="#fffdf7" stroke="#21634e" stroke-width="2"/><text x="190" y="427" font-size="21" fill="#182925" font-weight="600" text-anchor="middle">B</text><circle cx="280" cy="420" r="21" fill="#fffdf7" stroke="#21634e" stroke-width="2"/><text x="280" y="427" font-size="21" fill="#182925" font-weight="600" text-anchor="middle">C</text><circle cx="370" cy="420" r="21" fill="#21634e" stroke="#21634e" stroke-width="2"/><text x="370" y="427" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">D</text><circle cx="460" cy="420" r="21" fill="#21634e" stroke="#21634e" stroke-width="2"/><text x="460" y="427" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">E</text><circle cx="550" cy="420" r="21" fill="#fffdf7" stroke="#21634e" stroke-width="2"/><text x="550" y="427" font-size="21" fill="#182925" font-weight="600" text-anchor="middle">F</text><circle cx="640" cy="420" r="21" fill="#21634e" stroke="#21634e" stroke-width="2"/><text x="640" y="427" font-size="21" fill="#fff" font-weight="600" text-anchor="middle">G</text><circle cx="730" cy="420" r="21" fill="#fffdf7" stroke="#21634e" stroke-width="2"/><text x="730" y="427" font-size="21" fill="#182925" font-weight="600" text-anchor="middle">H</text><path d="M122 160 L613 160" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M640 183 L640 266" stroke="#b75c2b" stroke-width="4" fill="none" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M615 290 L398 290" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M370 313 L370 396" stroke="#b75c2b" stroke-width="4" fill="none" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M394 420 L432 420" stroke="#b75c2b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="491" y="145" font-size="24" fill="#b75c2b" font-weight="700" text-anchor="start">Q</text><text x="490" y="276" font-size="24" fill="#b75c2b" font-weight="700" text-anchor="start">Q</text><text x="490" y="405" font-size="24" fill="#b75c2b" font-weight="700" text-anchor="start">Q</text><rect x="32" y="475" width="776" height="96" rx="12" fill="#eef4ee" stroke="#b6c7bd"/><text x="52" y="509" font-size="22" fill="#182925" font-weight="600" text-anchor="start">最高层随机决定，并非按重要性或语义类别分层。</text><text x="52" y="544" font-size="21" fill="#53645d" font-weight="400" text-anchor="start">A、G 出现在三层；D 出现在两层；每层单独维护边。</text><text x="32" y="607" font-size="19" fill="#53645d" font-weight="400" text-anchor="start">图中水平距离仅作投影示意；真实检索在高维空间中进行。</text></g></svg>