name: Deploy Astro blog to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hnitrogen.github.io
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages publishing source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`;
          const headers = {
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const current = await fetch(url, { headers, signal: AbortSignal.timeout(30000) });
          if (!current.ok) throw new Error(`Cannot read Pages settings: ${current.status} ${await current.text()}`);
          const pages = await current.json();
          if (pages.build_type !== 'workflow' || pages.cname) {
            const updated = await fetch(url, {
              method: 'PUT',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ build_type: 'workflow', cname: null }),
              signal: AbortSignal.timeout(30000),
            });
            if (!updated.ok) throw new Error(`Cannot configure Pages: ${updated.status} ${await updated.text()}`);
          }
          console.log('Pages publishing source: GitHub Actions; domain: hnitrogen.github.io');
          NODE
      - uses: actions/deploy-pages@v5
        id: deployment
